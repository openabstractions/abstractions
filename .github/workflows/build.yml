name: build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  go:
    name: go (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: serve/go.mod
          cache: false
      - name: select verified Windows Go SDK and smoke duplex pipes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 tools/windows_go_sdk.py --cache-dir "$RUNNER_TEMP/windows-go-sdk" --github-env --smoke-dir "$RUNNER_TEMP/windows-go-smoke" > windows-go-sdk-proof.json
          printf '\n### Verified Windows Go SDK and duplex race smoke\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat windows-go-sdk-proof.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: preserve Windows Go SDK source identity and smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-go-sdk-${{ github.job }}-${{ github.run_attempt }}
          path: |
            windows-go-sdk-proof.json
            ${{ runner.temp }}/windows-go-smoke/named-pipe-race.log
            ${{ runner.temp }}/windows-go-smoke/smoke-receipt.json
          if-no-files-found: error
      - name: build and test
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC GOWORK GOFLAGS
          # These paths are published by split.manifest, not private workspace
          # modules. Public module pins must resolve without sibling replaces.
          status=0
          for module in serve monitor idl/gen mcp-gateway examples/logging-quickstart examples/pretend-lemonade; do
            echo "::group::$module: public dependency build and tests"
            timeout=10m
            if [ "$module" = serve ]; then timeout=30m; fi
            if [ ! -f "$module/go.mod" ]; then
              echo "::error::$module/go.mod missing"
              status=1
              printf '%s: %s FAILED (missing go.mod)\n' "$RUNNER_OS" "$module" >> "$GITHUB_STEP_SUMMARY"
            elif (cd "$module" && go build ./... && go test -v -count=1 "-timeout=$timeout" ./...); then
              printf '%s: %s build and Go tests passed with GOWORK=off\n' "$RUNNER_OS" "$module" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              printf '%s: %s FAILED (build or Go tests)\n' "$RUNNER_OS" "$module" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          # Generator tests report optional compiler/interpreter skips in their
          # verbose output. This job is Go build proof, not all-language proof.
          printf 'Inspect generator SKIP lines for unavailable external toolchains; this is not an all-language conformance verdict.\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
