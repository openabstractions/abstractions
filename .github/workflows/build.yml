name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  go:
    name: go (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: serve/go.mod
          cache: false
      - name: build and test
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC GOWORK GOFLAGS
          # These paths are published by split.manifest, not private workspace
          # modules. Public module pins must resolve without sibling replaces.
          for module in serve monitor idl/gen; do
            echo "::group::$module: public dependency build and tests"
            test -f "$module/go.mod"
            (cd "$module" && go build ./... && go test -v -count=1 -timeout=10m ./...)
            echo "::endgroup::"
            printf '%s: %s build and Go tests passed with GOWORK=off\n' "$RUNNER_OS" "$module" >> "$GITHUB_STEP_SUMMARY"
          done
          # Generator tests report optional compiler/interpreter skips in their
          # verbose output. This job is Go build proof, not all-language proof.
          printf 'Inspect generator SKIP lines for unavailable external toolchains; this is not an all-language conformance verdict.\n' >> "$GITHUB_STEP_SUMMARY"
